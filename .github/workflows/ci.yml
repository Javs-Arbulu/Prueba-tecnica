name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: support
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key
      DATABASE_URL: postgres://support:support@localhost:5432/support

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy apps config

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests + coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Validate the OpenAPI schema is up to date
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml
          diff -u docs/openapi.yaml /tmp/openapi.yaml
