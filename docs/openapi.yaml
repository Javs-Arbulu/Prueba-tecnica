      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
  /api/v1/tickets/{public_id}/comments/:
