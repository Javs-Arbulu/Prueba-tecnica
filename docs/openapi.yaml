      summary: Change the status
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        description: The `version` the client last read. When present and stale the
          request is rejected with 409 `version_conflict` instead of silently overwriting
          somebody else's change.
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
