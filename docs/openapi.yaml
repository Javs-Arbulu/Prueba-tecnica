        description: Only unclaimed tickets
      tags:
      - tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTimelineEntryList'
          description: ''
components:
  schemas:
    AgentTicketCreateRequest:
      type: object
      description: |-
        Intake by an agent — typically a customer on the phone (ADR-10).

        The agent may record what the customer claimed *and* classify it in one go.
      properties:
        customer:
          $ref: '#/components/schemas/CustomerInputRequest'
        subject:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          minLength: 10
          maxLength: 20000
        reported_priority:
          allOf:
          - $ref: '#/components/schemas/TicketPriorityEnum'
          default: MEDIUM
        priority:
          $ref: '#/components/schemas/TicketPriorityEnum'
      required:
      - customer
      - description
      - subject
    AssignRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          description: Why the change was made. Stored with the audit event.
          maxLength: 2000
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Public id of the agent, or null to release the ticket.
      required:
      - assignee_id
    Comment:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        body:
          type: string
          readOnly: true
        is_internal:
          type: boolean
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - is_internal
      - public_id
    CommentCreateRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
        is_internal:
          type: boolean
          default: true
          description: Internal notes are never exposed by the public endpoints.
      required:
      - body
    Customer:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - name
      - public_id
    CustomerInputRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
      - name
    KindEnum:
      enum:
      - comment
      - event
      type: string
      description: |-
        * `comment` - comment
        * `event` - event
    PaginatedCommentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
    PaginatedTicketListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TicketList'
    PaginatedTimelineEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
    PaginatedUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/User'
    PatchedTicketUpdateRequest:
      type: object
      description: |-
        PATCH is limited to descriptive fields; state changes have their own
        endpoints so intent never has to be inferred from a diff (ADR-16).
      properties:
        subject:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          minLength: 10
          maxLength: 20000
    PriorityChangeRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          description: Why the change was made. Stored with the audit event.
          maxLength: 2000
        priority:
          $ref: '#/components/schemas/TicketPriorityEnum'
      required:
      - priority
    PublicTicketCreateRequest:
      type: object
      description: |-
        What an unauthenticated customer is allowed to state.

        Note what cannot be set from here: status, assignee, and the effective
        priority. The customer reports a priority; triage decides one (ADR-09).
      properties:
        customer:
          $ref: '#/components/schemas/CustomerInputRequest'
        subject:
          type: string
          minLength: 3
          maxLength: 200
        description:
          type: string
          minLength: 10
          maxLength: 20000
        reported_priority:
          allOf:
          - $ref: '#/components/schemas/TicketPriorityEnum'
          default: MEDIUM
      required:
      - customer
      - description
      - subject
    StatusChangeRequest:
      type: object
      properties:
        note:
          type: string
          default: ''
          description: Why the change was made. Stored with the audit event.
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TicketStatusEnum'
      required:
      - status
    SupportTokenObtainPairRequest:
      type: object
      description: |-
        Adds the role to the token and the user object to the login response.

        The client needs the role to render the right controls; making it do a second
        round trip to ``/me/`` right after logging in is gratuitous.
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TicketDetail:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/TicketPriorityEnum'
          readOnly: true
        reported_priority:
          allOf:
          - $ref: '#/components/schemas/TicketPriorityEnum'
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        description:
          type: string
          readOnly: true
        reported_by_name:
          type: string
          readOnly: true
        created_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        allowed_transitions:
          type: array
          items:
            $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        first_assigned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - allowed_transitions
      - assignee
      - closed_at
      - comment_count
      - created_at
      - created_by
      - customer
      - description
      - first_assigned_at
      - priority
      - public_id
      - reported_by_name
      - reported_priority
      - resolved_at
      - status
      - subject
      - updated_at
      - version
    TicketList:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/TicketPriorityEnum'
          readOnly: true
        reported_priority:
          allOf:
          - $ref: '#/components/schemas/TicketPriorityEnum'
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        version:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assignee
      - comment_count
      - created_at
      - customer
      - priority
      - public_id
      - reported_priority
      - status
      - subject
      - updated_at
      - version
    TicketPriorityEnum:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - URGENT
      type: string
      description: |-
        * `LOW` - Low
        * `MEDIUM` - Medium
        * `HIGH` - High
        * `URGENT` - Urgent
    TicketPublic:
      type: object
      description: |-
        What a customer may see about their own ticket.

        Subject, status and dates — no description of internal work, no agent
        identity, no history, no comments (ADR-03).
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        subject:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/TicketStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        closed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - closed_at
      - created_at
      - public_id
      - resolved_at
      - status
      - status_display
      - subject
      - updated_at
    TicketStatusEnum:
      enum:
      - OPEN
      - IN_PROGRESS
      - PENDING_CUSTOMER
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `IN_PROGRESS` - In progress
        * `PENDING_CUSTOMER` - Pending customer
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    TimelineComment:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        body:
          type: string
          readOnly: true
        is_internal:
          type: boolean
          readOnly: true
      required:
      - body
      - is_internal
      - public_id
    TimelineEntry:
      type: object
      description: |-
        One row of the merged history feed.

        Because every comment also produces a ``COMMENT_ADDED`` event, the timeline
        is a single ordered queryset rather than two lists zipped in Python — which
        is what lets it be cursor-paginated correctly (ADR-08).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/KindEnum'
          readOnly: true
        type:
          type: string
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        field:
          type: string
          readOnly: true
        old_value:
          type: string
          readOnly: true
        new_value:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        comment:
          allOf:
          - $ref: '#/components/schemas/TimelineComment'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - comment
      - created_at
      - field
      - id
      - kind
      - new_value
      - note
      - old_value
      - type
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    User:
      type: object
      description: |-
        The only representation of an internal user the API ever returns.

        Note what is absent: ``id``, ``password``, ``is_superuser``, ``last_login``.
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
      required:
      - display_name
      - email
      - first_name
      - last_name
      - public_id
      - role
    UserRoleEnum:
      enum:
      - AGENT
      - SUPERVISOR
      type: string
      description: |-
        * `AGENT` - Agent
        * `SUPERVISOR` - Supervisor
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: public
  description: Unauthenticated endpoints used by customers.
- name: auth
  description: Token issuing and the current user.
- name: tickets
  description: Agent-facing ticket workflow.
- name: agents
  description: Internal staff directory.
- name: ops
  description: Operational endpoints.
