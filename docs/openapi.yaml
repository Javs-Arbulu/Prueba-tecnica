        description: |-
          * `OPEN` - Open
          * `IN_PROGRESS` - In progress
          * `PENDING_CUSTOMER` - Pending customer
          * `RESOLVED` - Resolved
          * `CLOSED` - Closed
        explode: true
        style: form
      - in: query
        name: unassigned
        schema:
