openapi: 3.0.3
info:
  title: Support Request Management API
  version: 1.0.0
  description: REST API used by internal agents to triage, assign and resolve customer
    support requests. Every mutation is audited and every resource is addressed by
    its public UUID.
paths:
  /api/v1/:
    get:
      operationId: root_retrieve
      description: |-
        An index of the API.

        DRF's own router root lists only the registered viewsets, which here means a
        single link to /tickets/ and no hint that authentication, the public intake
        or the docs exist. Somebody who opens the base URL deserves the whole map.
      summary: Index of the API
      tags:
      - ops
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/agents/:
    get:
      operationId: agents_list
      description: Feeds the assignment picker. Inactive staff are never offered.
      summary: Internal agents available for assignment
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - agents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
  /api/v1/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Throttled: an unauthenticated endpoint that checks passwords is the
        cheapest thing in the system to attack.
      summary: Obtain an access/refresh token pair
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SupportTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SupportTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: |-
        Liveness plus a real dependency check.

        A health endpoint that only proves the process is up tells you nothing you
        did not already know; this one opens the database connection.
      summary: Liveness and database connectivity
      tags:
      - ops
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Healthy:
                  value:
                    status: ok
                    database: ok
                    time: '2026-01-01T00:00:00Z'
                  summary: healthy
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      summary: The authenticated user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/public/tickets/:
    post:
      operationId: public_tickets_create
      description: 'Unauthenticated intake. Throttled per IP and per reported email,
        and idempotent: send an `Idempotency-Key` header, or rely on the 60-second
        duplicate window. A replayed request answers `200` with the original ticket
        instead of creating a second one (ADR-15).'
      summary: Submit a support request
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Client-generated key; a repeat within 24h returns the same ticket.
      tags:
      - public
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicTicketCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPublic'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPublic'
          description: Duplicate submission replayed
        '429':
          description: '`throttled`'
  /api/v1/public/tickets/{public_id}/:
    get:
      operationId: public_tickets_retrieve
      description: Status and dates only. No agent identity, no comments, no history.
      summary: Track a support request
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - public
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPublic'
          description: ''
  /api/v1/tickets/:
    get:
      operationId: tickets_list
      description: |-
        The agent-facing ticket workflow.

        There is no ``DELETE``: a reported incident is a fact, and destroying it
        destroys the trail that made the system worth building (ADR-13).
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
          format: uuid
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: customer_email
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: array
          items:
            type: string
            enum:
            - HIGH
            - LOW
            - MEDIUM
            - URGENT
        description: |-
          * `LOW` - Low
          * `MEDIUM` - Medium
          * `HIGH` - High
          * `URGENT` - Urgent
        explode: true
        style: form
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - CLOSED
            - IN_PROGRESS
            - OPEN
            - PENDING_CUSTOMER
            - RESOLVED
        description: |-
          * `OPEN` - Open
          * `IN_PROGRESS` - In progress
          * `PENDING_CUSTOMER` - Pending customer
          * `RESOLVED` - Resolved
          * `CLOSED` - Closed
        explode: true
        style: form
      - in: query
        name: unassigned
        schema:
          type: boolean
        description: Only unclaimed tickets
      tags:
      - tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTicketListList'
          description: ''
    post:
      operationId: tickets_create
      description: Accepts an optional `Idempotency-Key`; a replay answers `200` with
        the original ticket instead of creating a second one.
      summary: Create a ticket on behalf of a customer
      tags:
      - tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTicketCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentTicketCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentTicketCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: Duplicate request replayed
  /api/v1/tickets/{public_id}/:
    get:
      operationId: tickets_retrieve
      description: |-
        The agent-facing ticket workflow.

        There is no ``DELETE``: a reported incident is a fact, and destroying it
        destroys the trail that made the system worth building (ADR-13).
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - tickets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
    patch:
      operationId: tickets_partial_update
      description: Only `subject` and `description`. State lives behind its own actions.
      summary: Edit the descriptive fields
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        description: The `version` the client last read. When present and stale the
          request is rejected with 409 `version_conflict` instead of silently overwriting
          somebody else's change.
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTicketUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTicketUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTicketUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
  /api/v1/tickets/{public_id}/assign/:
    post:
      operationId: tickets_assign_create
      description: '`assignee_id: null` releases the ticket; an `IN_PROGRESS` ticket
        then returns to `OPEN` (ADR-14).'
      summary: Assign, reassign or release
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        description: The `version` the client last read. When present and stale the
          request is rejected with 409 `version_conflict` instead of silently overwriting
          somebody else's change.
      - in: path
        name: public_id
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}$
        required: true
      tags:
      - tickets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssignRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketDetail'
          description: ''
  /api/v1/tickets/{public_id}/assign-to-me/:
    post:
      operationId: tickets_assign_to_me_create
      description: Shortcut for the only assignment an agent makes all day.
      summary: Take the ticket
      parameters:
      - in: header
        name: If-Match
        schema:
          type: integer
        description: The `version` the client last read. When present and stale the
          request is rejected with 409 `version_conflict` instead of silently overwriting
